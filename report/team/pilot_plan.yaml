# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu/nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 x 0,02 = 2,48; ceil(1.251 x 2,48) = 3.103;
#      ceil(3.103 / 75) = 42 người/nhóm, tổng 84 > 40 nên không đủ người.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng < 20 / 0,02 = 1.000, không đạt 1.251.
#   d) 6 depot mỗi nhóm: n hiệu dụng < 6 / 0,02 = 300; chỉ 6 cụm/nhóm, dưới 20.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu/người;
#      DE = 1 + 298 x 0,02 = 6,96; 20 x 299 / 6,96 = 859,20 mẫu hiệu dụng/nhóm.
#      Số yêu cầu thực tế tối thiểu: 20 x 299 = 5.980/nhóm, tổng 11.960; chỉ tính bước 0,50.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: 20 nhân viên đối chứng và 20 can thiệp chạy cùng tuần, cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: phân tầng theo depot, bốc thăm với seed 13, chốt 20 người/nhóm trước chạy.
#   3. Ảnh hưởng gián tiếp và cách giảm: cấp quyền theo staff_id, không chia sẻ gợi ý sang đối chứng; ghi log truy cập.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: chốt các trường dưới đây trước ngày bắt đầu dự kiến 23/11/2026.
#   5. Ít nhất 20 cụm mỗi nhóm: đúng 20 nhân viên/nhóm khi ở bước rollout 0,50.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện): phương án đề xuất dùng MDE 6 điểm;
# mục tiêu kinh tế ban đầu vẫn là +5 điểm, nhưng power khi tác động thật +5 điểm chỉ khoảng 0,64.
# Giám đốc vận hành phải ký chấp nhận đánh đổi trước pilot; chưa có xác nhận phê duyệt trong bài này.
# Không diễn giải kết quả không có ý nghĩa thống kê thành bằng chứng trợ lý không có tác động.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
# 51/1.200 = 4,25%; phạm vi noi_dia + hang_nang: 39/982 = 3,97% (dữ liệu giả lập của lab).
# Ngưỡng đề xuất: cao hơn đối chứng >= 2 điểm phần trăm hoặc vượt 6%; chỉ so các lứa đã đủ cửa sổ 7 ngày.
#
# Lịch dự kiến: 23-29/11/2026: 4 người can thiệp; 30/11-06/12: 10 người; 07-20/12: 20 người.
# 20 người đối chứng giữ nguyên suốt pilot; 16 rồi 10 người can thiệp chưa bật ở hai bước đầu không tính vào đối chứng.
# Mỗi bước đầu 1 tuần; bước 0,50 kéo dài ít nhất 2 tuần và đến khi mỗi người có >= 299 yêu cầu hợp lệ trong phạm vi.
# Ước tính ở 1.500 yêu cầu/ngày, tỉ trọng phạm vi 982/1.200 và phân bổ 1:1, 2 tuần cho khoảng 430 yêu cầu/người;
# đây là giả định khối lượng, phải kiểm bằng số thực tế, không thay thế điều kiện đủ mẫu từng người.
# Chỉ lấy mẫu hiệu quả ở bước 0,50; theo dõi mở lại sau đóng đủ 7 ngày, khóa dữ liệu dự kiến 28/12/2026.
# Mẫu phân tích cố định: 299 yêu cầu đầu tiên trong phạm vi của mỗi nhân viên ở bước 0,50, lấy theo thời gian nhận;
# tính mọi kết quả xử lý, không lọc theo thành công. Yêu cầu vượt số này vẫn được theo dõi an toàn và chi phí.
# Ngày 05/01/2027 chỉ ra quyết định hiệu quả nếu đủ mẫu và đủ thời gian theo dõi; thiếu thì kết luận chưa đủ bằng chứng.
# Tuần đầu xem lại 100%; chỉ giảm theo bậc khi kiểm tra mẫu xác nhận an toàn, không giảm chỉ để đạt ngưỡng chi phí.
# Nếu luật dừng buộc đổi phạm vi hoặc cách xử lý, dừng đợt đánh giá hiệu quả; không gộp số trước và sau thay đổi.
# Theo dõi chi phí và sử dụng là giám sát vận hành theo luật dừng; không kiểm định chỉ số chính giữa chừng.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang tại 12 depot LogiX-VN; chi phí 2.696 đ và 8.221 đ/việc (simulated). Loại quoc_te (22.515 đ/việc, simulated) vì đắt hơn 12.000 đ; loại doi_tac (10.215 đ/việc, simulated) vì điều khoản riêng và biên tiết kiệm thấp."
  assignment:
    unit: "staff"                 # 20 nhân viên mỗi nhóm; phân tầng depot, seed 13
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 người; bước cuối >= 2 tuần và đủ mẫu
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                    # đánh đổi phải được chủ pilot chấp nhận trước chạy
    alpha: 0.05
    power: 0.80
    n_per_arm: 859               # mẫu hiệu dụng; mẫu phân tích quan sát 5.980/nhóm, 299/người
    design_effect: 6.96          # mẫu phân tích cố định m = 299
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng chạy cùng thời gian tại cùng 12 depot, giữ luồng tự làm; không đổi nhóm trong pilot."
    spillover_risk: "Có nguy cơ chia sẻ câu trả lời trong depot; giới hạn quyền trợ lý theo staff_id, ghi log truy cập và rà hằng tuần; tài khoản đối chứng không được mở trợ lý."
    predeclared: "Chốt danh sách 20+20 nhân viên với seed 13, chỉ số chính, mục tiêu +5 điểm, MDE 6 điểm, cỡ mẫu, luật dừng và ngày quyết định trước 23/11/2026; phân tích cuối kỳ trên 299 yêu cầu đầu tiên trong phạm vi/người ở bước 0,50, công bố chênh lệch và khoảng tin cậy 95%."
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm hoặc vượt 6% TRONG 2 lần đánh giá hằng ngày liên tiếp, mỗi nhóm có ít nhất 100 yêu cầu đủ cửa sổ theo dõi THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và giao nhân viên xử lý KHÔNG THÌ không được tăng bước rollout khi chưa xử lý cảnh báo."
    - "NẾU phát hiện >= 1 ca hoàn tiền trùng cùng đơn TRONG bất kỳ 24 giờ THÌ Trưởng ca tắt chức năng hoàn tự động ngay, chậm nhất 30 phút, và đối soát sổ cái KHÔNG THÌ không được bật lại trước khi Kỹ sư trưởng sửa khóa chống trùng và Kế toán trưởng xác nhận đối soát."
    - "NẾU chi phí mỗi việc thành công (token, tool, xem lại và làm lại, dùng phút đo thực tế) > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia, giới hạn 2 lần chạy và rà 20 trace làm lại trong 3 ngày KHÔNG THÌ không được tăng rollout hoặc giảm xem lại chỉ để hạ chi phí."
    - "NẾU tỉ lệ sửa hoặc bỏ gợi ý trên các yêu cầu được xem lại > 40%, có ít nhất 20 lượt xem lại TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên và chốt biện pháp trong 3 ngày KHÔNG THÌ không được chuyển bước rollout tiếp."
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành hoặc Trưởng ca được ủy quyền bấm cờ tắt, hiệu lực chậm nhất 30 phút; dừng lệnh hoàn mới, đối soát lệnh đang xử lý và chống trùng; nhân viên tiếp nhận toàn bộ yêu cầu qua luồng tự làm."
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Toàn bộ dữ liệu lab: 1.200 yêu cầu, 1.624 lần chạy; phạm vi 982 yêu cầu; mở lại 51/1.200 = 4,25% và 39/982 = 3,97%."
    - "phut_xem_lai_simulated và phut_lam_lai_simulated; lương giả định 2.000 đ/phút; chi phí A3 là 2.696, 8.221, 22.515, 10.215 đ/việc (simulated)."
    - "B4 xem lại 100% mất 5 phút/yêu cầu, làm lại 9 hoặc khoảng 15,3 phút/ca; 11.743 hoặc 12.415 đ/việc; hòa vốn xem lại khoảng 5,1 hoặc 4,8 phút (simulated)."
    - "Giả định lab: 40 nhân viên, 12 depot, 1.500 yêu cầu/ngày, nhân viên tự làm 12.000 đ/yêu cầu, chi phí cố định 40 triệu đ/tháng."
    - "Giả định thống kê: baseline 0,70; mục tiêu +5 điểm; MDE 6 điểm; alpha 0,05; power 0,80; ICC 0,02; power khoảng 0,64 nếu tác động thật chỉ +5 điểm."
    - "Ngưỡng quản trị đề xuất, chưa phải kết quả đo: chênh mở lại +2 điểm phần trăm, trần 6%, 1 ca hoàn trùng, 8.000 đ/việc, bỏ qua gợi ý 40%."
